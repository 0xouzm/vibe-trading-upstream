name: Loader health

# Weekly canary over the no-auth live data sources (#1623). Each loader fetches
# one known-liquid symbol and the frame is checked for shape and freshness, so
# a dead or drifted endpoint goes red here before a user files it.

on:
  schedule:
    # Monday 06:13 UTC (off the :00 herd)
    - cron: "13 6 * * 1"
  workflow_dispatch:

jobs:
  canary:
    name: Live source canary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with loader dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the canary
        env:
          VIBE_TRADING_LOADER_HEALTH: "1"
        run: python -m pytest agent/tests/test_loader_health.py -q -v
